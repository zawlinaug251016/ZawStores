(function(){
  var PREFIX="zstores_",LOG_KEY="zstores_changelog_v1",SAVED_KEY="zstores_lastsaved_v1";
  function utf8(s){return unescape(encodeURIComponent(s))}
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

  window.zsFmtTime=fmt;
  window.zsDiffRules=function(rules){

    if(prev){

        od.filter(function(x){return nw.indexOf(x)<0}).forEach(function(x){window.zsLog('Rule removed: "'+x+'" from '+cat)});

    }
    try{window.__zsPrevRules=JSON.parse(JSON.stringify(rules))}catch(e){}
  };

  /* backup / restore of everything stored on this device */
  window.zsExportAll=function(){

        var old=[];for(var j=0;j<localStorage.length;j++){var k=localStorage.key(j);if(k&&k.indexOf(PREFIX)===0)old.push(k)}

        keys.forEach(function(k){if(k!==SAVED_KEY)localStorage.setItem(k,env.data[k])});
        window.zsLog("Full backup imported (backup dated "+fmt(env.exportedAt)+")");
        location.reload();
      }catch(e){alert("That is not a valid Zstores backup file.")}
    };
    r.readAsText(f);
  };
})();
</script>

                </div>

                <button type="submit"className="w-full md:w-auto px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm rounded-lg transition focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400">
                  Add item rule
                </button>
              </form>

              <div className="grid md:grid-cols-2 gap-6">
                {Object.entries(n).map(([e,a])=>{const t=!!WARD_ONLY_CATEGORIES[e];return<div key={e}className={`border rounded-xl p-4 ${t?"border-slate-100 bg-slate-50":"border-slate-200"}`}>
                    <h3 className="font-bold text-slate-800 border-b pb-2 mb-3 flex justify-between items-center gap-2">
                      <CategoryLabel name={e}isSelected={!1}/>
                      <span className="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-600 flex-shrink-0">
                        {t?"ward-based":`${a.length} keywords`}
                      </span>
                    </h3>

                    {t?<p className="text-xs text-slate-400 italic">{WARD_ONLY_CATEGORIES[e]}</p>:<div className="flex flex-wrap gap-1.5">
                        {a.length===0?<span className="text-xs text-slate-400 italic">No keywords yet — nothing routes here automatically until you add one.</span>:a.map((s,r)=><span key={r}className="bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded-md flex items-center gap-2 border border-slate-200">
                              {s}
                              <button onClick={()=>me(e,s)}aria-label={`Remove ${s}`}className="text-slate-400 hover:text-red-500 font-bold focus:outline-none focus-visible:ring-2 focus-visible:ring-red-300 rounded">
                                ×
                              </button>
                            </span>)}
                      </div>}
                  </div>})}
              </div>
            </div>}

          {}
          {i.length>0&&R==="picker"&&<div className="no-print md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 p-3 flex items-center justify-between gap-3 shadow-[0_-4px_12px_rgba(0,0,0,0.06)]">
              <div className="text-xs font-semibold text-slate-600 tabular-nums">
                {F}/{f.length} picked
              </div>
              <button onClick={()=>window.print()}className="px-4 py-2 bg-slate-800 text-white text-sm font-medium rounded-lg">
                Print run
              </button>
            </div>}
        </div>}const root=ReactDOM.createRoot(document.getElementById("root"));root.render(<App/>);
</script>
</body></html>
